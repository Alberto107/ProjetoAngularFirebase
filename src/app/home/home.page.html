<ion-content [fullscreen]="true">
    <!-- loop -->

    <ion-list>
        <ng-container *ngFor="let livro of this.livros">
           <ion-item>
             <ion-label>Título: {{ livro.titulo }}</ion-label>
           </ion-item>
           <ion-item>
             <ion-label>
                Sinopse: {{ livro.sinopse }}
             </ion-label>
           </ion-item>
           <ion-item>
             <ion-label>
                Número de páginas: {{ livro.paginas }}
             </ion-label>
           </ion-item>
           <ng-container *ngFor="let categoria of livro.categoria">
               <h3 *ngIf="categoria.nome == 'Científico' " style="color: red">{{ categoria.nome }}</h3>
           </ng-container>
        </ng-container>
        <ion-item>
            <ion-label>Categorias</ion-label>
        </ion-item>  
    </ion-list>

</ion-content>

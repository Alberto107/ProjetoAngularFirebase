<ion-content [fullscreen]="true">

    <table>
        <tr>
            <th>ISBN</th>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Ações</th>
        </tr>
            <ng-container *ngFor="let livro of this.livros">
                <tr>
                    <td>{{ livro.isbn }}</td>
                    <td>{{ livro.titulo }}</td>
                    <td>
                        <ng-container *ngFor="let cat of livro.categoria">
                            <ion-card>
                                <ion-row>
                                  <ion-col size="12">
                                    <ion-label>{{ cat.nome }}</ion-label>
                                  </ion-col>
                                </ion-row> 
                            </ion-card>

                        </ng-container>
                    </td>
                    <td>
                <ion-button>
                    <!-- editar -->
                    <ion-icon name="build-outline"></ion-icon>
                </ion-button>
                <ion-button>
                    <!-- apagar -->
                    <ion-icon name="trash-bin-outline"></ion-icon>
                </ion-button>
                    </td>
                </tr>
            </ng-container>
    </table>

    <br>

    <hr>

    <br>
    
    <table>
        <tr>
            <th>Código:</th>
            <th>Nome:</th>
            <th>Marca:</th>
            <th>Preço:</th>
            <th>Quantidade:</th>
            <th>Ações</th>
        </tr>
  
            <ng-container *ngFor="let produto of this.produtos">
                <tr>
                    <td>{{ produto.codigo }}</td>
                    <td>{{ produto.nome }}</td>
                    <td>{{ produto.marca }}</td>
                    <td>
                        <ng-container>
                            <ion-card>
                                <ion-row>
                                  <ion-col size="12">
                                    <ion-label>{{ produto.preco }}</ion-label>
                                  </ion-col>
                                </ion-row> 
                            </ion-card>

                        </ng-container>
                    </td>
                                        <td>
                        <ng-container>
                            <ion-card>
                                <ion-row>
                                  <ion-col size="12">
                                    <ion-label>{{ produto.quantidade }}</ion-label>
                                  </ion-col>
                                </ion-row> 
                            </ion-card>

                        </ng-container>
                    </td>
                    <td>
                <ion-button>
                    <!-- editar -->
                    <ion-icon name="build-outline"></ion-icon>
                </ion-button>
                <ion-button>
                    <!-- apagar -->
                    <ion-icon name="trash-bin-outline"></ion-icon>
                </ion-button>
                    </td>
                </tr>
            </ng-container>
     
    </table>
    
    
</ion-content>
